name: Publish Pinterest pins (API channel)

# Spreads the day's pins over 5 time slots (pinterest.publish_runs_per_day: 5).
# Runs only when the repository variable PINTEREST_API_ENABLED is "true".
on:
  schedule:
    - cron: "7 6,11,16,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: etsy-engine-state
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ vars.PINTEREST_API_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publish due pins
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: python -m etsy_engine publish

      - name: Save state
        if: always()
        run: |
          git config user.name "etsy-engine-bot"
          git config user.email "etsy-engine-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Pins published $(date -u +%FT%H:%M)"
          git push
