name: Setup / Connect (phone-friendly)

# Phone se setup: Actions > "Setup / Connect" > Run workflow
#   action = check            -> kaun si keys lagi hain, kaun si baaki
#   action = etsy-start       -> Etsy login link deta hai
#   action = etsy-finish      -> login ke baad wala URL paste karo
#   action = pinterest-start / pinterest-finish -> same for Pinterest API
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Kya karna hai"
        required: true
        type: choice
        options: [check, etsy-start, etsy-finish, pinterest-start, pinterest-finish]
      redirected_url:
        description: "Sirf *-finish ke liye: browser ka poora URL (localhost:3003/callback?code=...)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: etsy-engine-state
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          ACTION: ${{ inputs.action }}
          REDIRECTED_URL: ${{ inputs.redirected_url }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          case "$ACTION" in
            check) python -m etsy_engine check ;;
            *-start)  python -m etsy_engine connect "${ACTION%-start}" start ;;
            *-finish) python -m etsy_engine connect "${ACTION%-finish}" finish --url "$REDIRECTED_URL" ;;
          esac
      - name: Save encrypted tokens
        if: always()
        run: |
          git config user.name "etsy-engine-bot"
          git config user.email "etsy-engine-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Setup: $ACTION"
          git push
        env:
          ACTION: ${{ inputs.action }}
